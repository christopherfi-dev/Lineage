<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LINEAGE</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Karla:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="stage">
  <canvas id="world"></canvas>

  <div id="hud">
    <div class="gen">Generation <b id="gen">0</b><span id="fast" hidden>Fast-forward</span></div>
    <div class="bar"><i id="genbar"></i></div>
    <div class="line" id="counts"></div>
    <div class="line small" id="zones"></div>
    <div class="line small" id="others" hidden></div>
  </div>

  <div id="hint"><span class="dot"></span>Drag to look around · tap an animal to follow its family</div>

  <div id="label" hidden>
    <div id="label-who"></div>
    <div id="label-about"></div>
  </div>

  <button id="home" type="button"><span class="ring"><i></i></span>Back to my group</button>

  <div id="logbar"><span class="ring"></span><span id="log"></span></div>

  <!-- A choice point: the world pauses (scope decision 6). -->
  <div id="choice" hidden>
    <div class="grab"></div>
    <div class="eyebrow" id="choice-count"></div>
    <h2>Which one will you follow?</h2>
    <div id="choice-since"></div>
    <div id="options"></div>
    <div class="timer"><i id="choice-bar"></i></div>
    <div id="choice-note"></div>
  </div>

  <!-- Every ending is a reflection screen, not a game-over screen. -->
  <div id="ending" hidden>
    <div class="card">
      <div class="eyebrow">The end of this story</div>
      <h2 id="ending-title"></h2>
      <div class="cols">
        <section>
          <canvas id="ending-animal"></canvas>
          <h3 id="ending-traits-title">Your group's traits</h3>
          <div id="ending-traits"></div>
          <div class="legend"><span class="dot"></span>changed during the story</div>
        </section>
        <section>
          <!-- The reflection first, the story's history after it: a long story only scrolls the list. -->
          <p id="ending-question"></p>
          <div id="ending-evidence" hidden>
            <h3>A clue</h3>
            <div id="ending-compare" hidden></div>
            <p id="ending-evidence-line"></p>
          </div>
          <!-- The real-animal reveal (scope decision 10): a surviving group's actual average traits and main
               habitat, matched in src/reveal.js by docs/LINEAGE_REAL_ANIMAL_REVEAL.md. Text for now; art comes later. -->
          <div id="reveal" hidden>
            <p id="reveal-line"></p>
            <p id="reveal-why"></p>
          </div>
          <h3 id="ending-choices-title">Your choices</h3>
          <ol id="ending-choices"></ol>
        </section>
      </div>
      <div class="buttons">
        <button id="again" type="button">Try another family in this world</button>
        <button id="new-world" type="button">New world</button>
      </div>
    </div>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
