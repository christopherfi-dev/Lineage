<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Two fingers zoom the map, never the page: the panels keep their size. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>LINEAGE</title>
<meta name="theme-color" content="#EFE6D2">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./fonts/fonts.css">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="stage">
  <canvas id="world"></canvas>
  <!-- The warm light from the sun's side and the soft vignette: a small canvas stretched over the map (light.js). -->
  <canvas id="air" width="256" height="256" aria-hidden="true"></canvas>

  <!-- On a phone this is a slim bar (the number, the sun on its bar, your group's count); a tap opens it whole. -->
  <div id="hud">
    <div class="gen"><span class="label">Generation</span> <b id="gen">0</b><span id="fast" hidden>Fast-forward</span></div>
    <div class="bar"><i id="genbar"></i></div>
    <div class="mini" id="mini" hidden><i class="dot"></i><span id="mini-count"></span></div>
    <div class="line" id="counts"></div>
    <div class="line small" id="zones"></div>
    <div class="line small" id="others" hidden></div>
    <!-- "Your family so far": each chosen trait as a chip; a faded one greys out, with why (scope decision 59). -->
    <div class="line small" id="so-far" hidden></div>
  </div>

  <!-- Helping here / Hurting here (scope decision 60): what your family has that helps or hurts where it lives, under the panel. "Hurting here" only when it names a trait (scope decision 64). -->
  <div id="why-here" hidden></div>

  <div id="hint"><span class="dot"></span>Drag to look around · tap an animal to follow its family</div>

  <!-- The creature card (Step 3): tap any animal to see it up close. The world keeps running behind it. -->
  <div id="card" hidden>
    <div class="head">
      <div id="card-who"></div>
      <button id="card-close" type="button" aria-label="Close">&times;</button>
    </div>
    <canvas id="card-animal"></canvas>
    <p id="card-where"></p>
    <!-- A trait that doesn't fit where it lives, said gently (playtest). -->
    <p id="card-fit" hidden></p>
    <p id="card-new" hidden></p>
    <!-- A glowing newborn: follow its new variation, or keep looking (scope decisions 32, 42 and 43). -->
    <div id="card-follow" hidden></div>
    <!-- An animal not in your group: its group beside yours, and how it differs from yours (playtest). -->
    <div id="card-group" hidden></div>
    <div id="card-traits"></div>
  </div>

  <!-- A variation: a short caption beside the newborn that blooms (Step 4). -->
  <div id="bloom" hidden><span class="spark"></span><span id="bloom-line"></span></div>

  <button id="home" type="button"><span class="ring"><i></i></span>Back to my family</button>

  <!-- Sound on or off (Step 5): remembered on this device. -->
  <button id="mute" type="button" aria-label="Sound off" aria-pressed="false"></button>

  <!-- Visit another place: the camera flies there, and the narration sums it up (playtest). -->
  <div id="places" role="group" aria-label="Places">
    <button type="button" data-zone="0">Leaves</button>
    <button type="button" data-zone="1">Ground</button>
    <button type="button" data-zone="2">Water</button>
  </div>

  <!-- A living portrait of your animals' average body, redrawn each generation; a tap opens it (scope decision 61). -->
  <button id="portrait" type="button" aria-label="Your animals, on average" hidden><canvas></canvas></button>

  <!-- "Your animals, on average": the average body, how it changed, and the family tree strip (scope decision 61). -->
  <div id="average" hidden>
    <div class="grab"></div>
    <div class="head"><h2 id="average-title"></h2><button id="average-close" type="button" aria-label="Close">&times;</button></div>
    <div class="cols">
      <canvas id="average-animal"></canvas>
      <div id="average-traits"></div>
    </div>
    <h3 id="tree-title"></h3>
    <div id="tree" class="tree"></div>
  </div>

  <!-- A glowing baby off the screen: an arrow at the edge points to it, and a tap flies there (playtest). -->
  <div id="arrows"></div>

  <!-- Zoom the map, for anyone who can't pinch: under the sound button, never over the narration or a panel. -->
  <div id="zoom">
    <button id="zoom-in" type="button" aria-label="Zoom in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
    <button id="zoom-out" type="button" aria-label="Zoom out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
  </div>

  <div id="logbar"><span class="ring"></span><span id="log"></span></div>

  <!-- The backup choice panel: after a while with no follow, the world pauses (scope decision 34). -->
  <div id="choice" hidden>
    <div class="grab"></div>
    <div class="eyebrow" id="choice-count"></div>
    <h2>Which one will you follow?</h2>
    <div id="choice-since"></div>
    <div id="options"></div>
    <div class="timer"><i id="choice-bar"></i></div>
    <div id="choice-note"></div>
  </div>

  <!-- The first choice (scope decision 70): where the family will live, with a real baby of the family on each place's card. -->
  <div id="place" hidden>
    <div class="grab"></div>
    <div class="eyebrow">Choice 1</div>
    <h2 id="place-question"></h2>
    <div id="place-cards"></div>
    <div class="timer"><i id="place-bar"></i></div>
    <div id="place-note"></div>
  </div>

  <!-- Since your last choice: at the next follow, your line and your relatives here since the last one (scope decisions 34 and 67). -->
  <div id="since" hidden>
    <div class="grab"></div>
    <div class="eyebrow" id="since-count"></div>
    <div id="since-body"></div>
    <button id="since-next" type="button">Next</button>
    <div class="timer"><i id="since-bar"></i></div>
  </div>

  <!-- The prediction journal (Step 6): one question after every third follow, before the fast-forward. -->
  <div id="journal" hidden>
    <div class="grab"></div>
    <div class="eyebrow">A prediction</div>
    <h2 id="journal-question"></h2>
    <div id="journal-options"></div>
    <div id="journal-note"></div>
  </div>

  <!-- See, guess, explain (scope decisions 60 and 68): at a follow's result, a line dying out or a sudden drop, the child taps a guess, then reads why. -->
  <div id="guess" hidden>
    <div class="grab"></div>
    <div class="eyebrow">Why?</div>
    <h2 id="guess-question"></h2>
    <div id="guess-options"></div>
    <div id="guess-note"></div>
    <button id="guess-next" type="button" hidden>Next</button>
  </div>

  <!-- Naming the family (Step 5): right after the first tap, before generation 1. Time waits. -->
  <div id="naming" hidden>
    <div class="grab"></div>
    <h2 id="naming-question"></h2>
    <div id="naming-options"></div>
    <!-- Or the child types a name, or uses their own (scope decision 61). Nothing typed leaves the iPad. -->
    <div id="naming-more"></div>
    <div id="naming-typing" hidden>
      <p id="naming-prompt"></p>
      <div class="typing-row">
        <input id="naming-input" type="text" maxlength="12" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="done" aria-label="Name">
        <button id="naming-ok" type="button">OK</button>
      </div>
      <button id="naming-back" type="button">Back</button>
    </div>
    <div class="timer"><i id="naming-bar"></i></div>
    <div id="naming-note"></div>
  </div>

  <!-- The Field Guide (scope decision 62): 21 discoveries, each trait in each place. -->
  <button id="guide-button" type="button" aria-label="Field guide" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C6.5 4.3 9.3 4.3 12 6c2.7-1.7 5.5-1.7 8-.5v13c-2.5-1.2-5.3-1.2-8 .5-2.7-1.7-5.5-1.7-8-.5z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M12 6v13" stroke="currentColor" stroke-width="1.9"/></svg></button>
  <div id="guide" hidden>
    <div class="grab"></div>
    <div class="head"><h2 id="guide-title"></h2><button id="guide-close" type="button" aria-label="Close">&times;</button></div>
    <p id="guide-count"></p>
    <div id="guide-grid"></div>
  </div>

  <!-- The opening (scope decision 77): before the first tap, the twelve cards face down, then flipping one after another;
       "How many can you discover?"; then they puff away. A tap skips to the end. -->
  <div id="opening" hidden>
    <div class="lines"><p id="opening-line-1"></p><p id="opening-line-2"></p></div>
    <div id="opening-grid" class="cgrid"></div>
  </div>

  <!-- The collection (scope decision 74): the twelve animals a line can become, evolved ones with their picture, the rest
       mystery cards. From its button on the start screen; the opening shows it too (scope decision 77). -->
  <button id="collection-button" type="button" aria-label="Your collection" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6" width="11" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M8 3.5h10.5a2 2 0 0 1 2 2V17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg><span id="collection-button-count"></span></button>
  <div id="collection" hidden>
    <div class="panel">
      <div class="head"><h2 id="collection-title"></h2><button id="collection-close" type="button" aria-label="Close">&times;</button></div>
      <p id="collection-count"></p>
      <div id="collection-grid" class="cgrid"></div>
      <p class="credits" id="collection-credits"></p>
    </div>
  </div>

  <!-- Every ending is a reflection in short steps with Next (scope decision 62): what happened, your idea, check my idea, the reveal. -->
  <div id="ending" hidden>
    <div class="card">
      <div class="eyebrow"><span id="ending-step-name"></span> · <span id="ending-step-count"></span></div>
      <!-- 0. The line's home (scope decision 73): "You did it!", the animal the line became, what was followed and why; or, at
           the story's last generation short of the win, "still changing". Not after an early ending. -->
      <section class="step" id="step-result" hidden>
        <h2 id="result-title"></h2>
        <div class="result-body">
          <div class="result-pics">
            <figure id="result-figure"><canvas id="result-line"></canvas></figure>
            <!-- The real animal's card beside the line (scope decision 74). -->
            <div id="result-card"></div>
          </div>
          <div id="result-lines"></div>
        </div>
      </section>
      <!-- 1. What happened: the family at the start and at the end, its family tree, and the result. -->
      <section class="step" id="step-happened">
        <h2 id="ending-title"></h2>
        <div class="pair">
          <figure><canvas id="ending-start"></canvas><figcaption id="ending-start-line"></figcaption></figure>
          <figure><canvas id="ending-animal"></canvas><figcaption id="ending-look-line"></figcaption></figure>
        </div>
        <h3 id="ending-tree-title"></h3>
        <div id="ending-tree" class="tree"></div>
        <div id="ending-result"></div>
      </section>
      <!-- 2. Your idea: a sentence to build, or the child's own words. It must be answered before the story can be played again. -->
      <section class="step" id="step-idea" hidden>
        <p id="ending-question"></p>
        <div id="idea-builder"></div>
        <p id="idea-said"></p>
        <label id="idea-or" for="idea-own"></label>
        <textarea id="idea-own" rows="2" maxlength="140" autocomplete="off" spellcheck="false"></textarea>
        <p id="idea-note"></p>
        <button id="idea-done" type="button" disabled></button>
      </section>
      <!-- 3. Check my idea: the idea against the table, with the clue and the last choice's line beside its relatives. -->
      <section class="step" id="step-check" hidden>
        <p id="idea-mine"></p>
        <div id="idea-check"></div>
        <div id="ending-evidence" hidden>
          <h3>A clue</h3>
          <div id="ending-compare" hidden></div>
          <p id="ending-evidence-line"></p>
        </div>
        <div id="ending-fair" hidden>
          <h3>Your last choice</h3>
          <div id="ending-fair-rows"></div>
        </div>
      </section>
      <!-- 4. The reveal: the real animal the family became like (scope decisions 10 and 40), its traits and the story's history. -->
      <section class="step" id="step-reveal" hidden>
        <div id="reveal" hidden>
          <img id="reveal-picture" alt="" hidden>
          <p id="reveal-line"></p>
          <p id="reveal-why"></p>
          <!-- "Did you know?" facts about the real animal, each with a speaker (scope decision 46). -->
          <div id="reveal-facts"></div>
        </div>
        <h3 id="ending-traits-title">Your group's traits</h3>
        <div id="ending-traits"></div>
        <div class="legend"><span class="dot"></span>different from the start</div>
        <!-- The prediction journal (Step 6): each prediction beside what happened. -->
        <div id="ending-predictions" hidden>
          <h3>Your predictions</h3>
          <p id="ending-predictions-label"></p>
          <ol id="ending-predictions-list"></ol>
        </div>
        <h3 id="ending-choices-title">Your choices</h3>
        <ol id="ending-choices"></ol>
        <div class="extras">
          <button id="guide-open" type="button"></button>
          <button id="card-save" type="button"></button>
          <a id="journal-link" href="./journal.html" target="_blank" rel="noopener"></a>
        </div>
      </section>
      <!-- 5. The collection (scope decision 74): the animal just evolved, new on this iPad, among the twelve. -->
      <section class="step" id="step-collection" hidden>
        <h2 id="ending-collection-count"></h2>
        <div id="ending-collection-grid" class="cgrid"></div>
        <p class="credits" id="ending-collection-credits"></p>
      </section>
      <div class="buttons">
        <button id="ending-next" type="button">Next</button>
        <!-- After the ending, one way on (scope decision 82): how many animals this iPad has found, and a fresh game in a new
             world, whose quick card flip shows which are still to find. -->
        <div id="find-another" hidden>
          <p id="find-another-line"></p>
          <button id="find-another-button" type="button">Find another animal!</button>
        </div>
        <!-- The teacher demo, which has no collection, keeps these two. -->
        <button id="again" type="button" hidden>Try another family in this world</button>
        <button id="new-world" type="button" hidden>New world</button>
        <!-- "Try another family" with fewer than 25 generations of the story left in this world (scope decision 64). -->
        <div id="nearly-over" hidden>
          <p id="nearly-over-line"></p>
          <button id="nearly-new" type="button">New world</button>
          <button id="nearly-keep" type="button">Keep going anyway</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
