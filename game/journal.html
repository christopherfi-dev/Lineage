<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>LINEAGE journal</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./fonts/fonts.css">
<!--
  My Journal (scope decision 62): for the teacher, every story told on this
  iPad, newest first, read from this iPad's own storage (localStorage,
  "lineage.journal"), and the collection of animals evolved here (scope
  decision 74, "lineage.collection"). Nothing is sent anywhere: this page
  makes no network call, and clearing it only clears this iPad. "Start fresh"
  clears the journal, the Field Guide and the collection, for a new child.
-->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: calc(20px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); background: #CFC5A8; color: #2B3026; font: 16px/1.45 Karla, system-ui, sans-serif; }
  main { max-width: 820px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font: 600 32px/1.1 Petrona, Georgia, serif; }
  .lead { margin: 0 0 18px; color: #5A6151; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 18px; }
  .bar button, .bar a { min-height: 44px; padding: 10px 18px; border: 0; border-radius: 999px; background: #FBF6EA; color: #14657F; font: 700 15px Karla, system-ui, sans-serif; text-decoration: none; cursor: pointer; box-shadow: 0 2px 8px rgba(45, 38, 20, .15); }
  .bar .clear { color: #9A3B20; }
  article { margin: 0 0 14px; padding: 16px 20px; border-radius: 18px; background: #FBF6EA; box-shadow: 0 2px 10px rgba(45, 38, 20, .15); }
  article h2 { margin: 0; font: 600 23px/1.2 Petrona, Georgia, serif; }
  .meta { margin: 2px 0 10px; font-size: 14px; color: #6E6750; }
  .idea { margin: 8px 0; padding: 10px 14px; border-radius: 12px; background: #EFE5CE; font: italic 500 19px/1.35 Petrona, Georgia, serif; }
  .check { margin: 4px 0 8px; font-weight: 600; }
  .check.right { color: #2F7A4B; }
  dl { display: grid; grid-template-columns: 150px 1fr; gap: 4px 12px; margin: 8px 0 0; font-size: 15px; }
  dt { font-weight: 700; color: #7D745C; }
  dd { margin: 0; }
  ul { margin: 0; padding-left: 18px; }
  .empty { padding: 24px; border-radius: 18px; background: #FBF6EA; text-align: center; color: #6E6750; }
  .collection { margin: 0 0 18px; padding: 16px 20px; border-radius: 18px; background: #FBF6EA; box-shadow: 0 2px 10px rgba(45, 38, 20, .15); }
  .collection h2 { margin: 0 0 6px; font: 600 23px/1.2 Petrona, Georgia, serif; }
  .collection ol { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 4px 16px; margin: 6px 0 0; padding-left: 20px; }
  .collection .none { margin: 0; color: #6E6750; }
  @media print { body { background: #fff; } .bar { display: none; } article { box-shadow: none; border: 1px solid #ddd; break-inside: avoid; } }
</style>
</head>
<body>
<main>
  <h1>My journal</h1>
  <p class="lead">Every story told on this iPad, newest first: the family, what the child chose and predicted, and the child's own idea about why. It stays on this iPad; nothing is sent anywhere.</p>
  <div class="bar">
    <a href="./">Back to the game</a>
    <button type="button" id="print">Print</button>
    <button type="button" id="clear" class="clear">Clear this journal</button>
    <button type="button" id="fresh" class="clear">Start fresh</button>
  </div>
  <section class="collection" id="collection"></section>
  <div id="stories"></div>
</main>
<script>
  // Read only this iPad's own storage; every value is shown as text, never as HTML.
  const KEY = "lineage.journal", GUIDE = "lineage.fieldGuide", COLLECTION = "lineage.collection";
  const readKey = (key) => { try { return JSON.parse(localStorage.getItem(key) || "[]"); } catch { return []; } };
  const read = () => readKey(KEY);
  // The collection's twelve animals, a row for each place (game/src/reveal.js), and those evolved on this iPad.
  const GRID = [["squirrel", "Squirrel"], ["sloth", "Sloth"], ["koala", "Koala"], ["slow-loris", "Slow loris"], ["hare", "Hare"], ["lynx", "Lynx"],
    ["cheetah", "Cheetah"], ["jerboa", "Jerboa"], ["river-otter", "River otter"], ["seal", "Seal"], ["beaver", "Beaver"], ["platypus", "Platypus"]];
  function renderCollection() {
    const box = document.getElementById("collection"), found = readKey(COLLECTION).filter((x) => x && GRID.some(([id]) => id === x.id));
    box.replaceChildren(el("h2", "", `The collection: ${found.length} of ${GRID.length} evolved on this iPad`));
    if (!found.length) { box.append(el("p", "none", "None yet. An animal joins once a child's line becomes it.")); return; }
    const ol = el("ol");
    for (const x of found) {
      const name = GRID.find(([id]) => id === x.id)[1], when = new Date(x.when);
      ol.append(el("li", "", `${name}${x.name ? `, the ${x.name} family` : ""}${isNaN(when) ? "" : `, ${when.toLocaleDateString()}`}`));
    }
    box.append(ol);
  }
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  function render() {
    const list = read(), box = document.getElementById("stories");
    box.replaceChildren();
    if (!list.length) { box.append(el("p", "empty", "No stories yet. They appear here once a child gives their idea at the end of a story.")); return; }
    for (const s of list) {
      const a = el("article");
      const when = new Date(s.when);
      a.append(el("h2", "", s.name ? `The ${s.name} family` : "A family with no name"));
      // A line that fit its home with no follow in the story is no win (scope decision 96): the place did all the choosing.
      a.append(el("p", "meta", `${isNaN(when) ? "" : when.toLocaleString()} · world ${s.seed} · generations ${s.from}–${s.to} · ${s.outcome === "died" ? `died out after ${s.lasted}` : s.won ? `fit its home after ${s.lasted}` : s.placeChose ? `fit its home after ${s.lasted}, with nothing followed: the place did all the choosing` : `survived ${s.lasted}`}`));
      a.append(el("p", "idea", `“${s.idea}”${s.typed ? " (typed)" : ""}`));
      a.append(el("p", `check${s.right ? " right" : ""}`, (s.check || []).join(" ")));
      const dl = el("dl");
      const row = (k, v) => { dl.append(el("dt", "", k)); const dd = el("dd"); if (Array.isArray(v)) { const ul = el("ul"); for (const x of v) ul.append(el("li", "", x)); dd.append(v.length ? ul : document.createTextNode("none")); } else dd.textContent = v; dl.append(dd); };
      row("Followed", s.choices || []);
      row("Became like", s.reveal || "no real animal yet");
      row("Predictions", (s.predictions || []).map((p) => `${p.question} Answered: “${p.answer}”. ${p.lines.join(" ")}`));
      row("Why? guesses", (s.guesses || []).map((g) => `${g.question} ${g.answer ? `Guessed: “${g.answer}”${g.right ? " (as the table says)" : ""}` : "No guess."}`));
      a.append(dl);
      box.append(a);
    }
  }
  document.getElementById("print").addEventListener("click", () => print());
  document.getElementById("clear").addEventListener("click", () => {
    if (!confirm("Clear every story in this iPad's journal? This can't be undone.")) return;
    try { localStorage.setItem(KEY, "[]"); } catch { /* storage blocked */ }
    render();
  });
  // Start fresh, for a new child: the journal, the Field Guide and the collection on this iPad.
  document.getElementById("fresh").addEventListener("click", () => {
    if (!confirm("Start fresh? This clears this iPad's journal, Field Guide and collection. It can't be undone.")) return;
    try { for (const key of [KEY, GUIDE, COLLECTION]) localStorage.setItem(key, "[]"); } catch { /* storage blocked */ }
    render();
    renderCollection();
  });
  render();
  renderCollection();
</script>
</body>
</html>
