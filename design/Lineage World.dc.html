<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Karla:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#CFC5A8;-webkit-font-smoothing:antialiased;}
a{color:#14657F;text-decoration:none;}
a:hover{color:#1E8AAC;}
@keyframes lgIn{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:none;}}
</style>
</helmet>
<div ref="{{ stageRef }}" style="position:fixed;inset:0;overflow:hidden;background:#CFC5A8;font-family:Karla,'Avenir Next',system-ui,sans-serif;color:#2B3026;touch-action:none;user-select:none;-webkit-user-select:none;">

  <canvas ref="{{ worldRef }}" style="position:absolute;inset:0;display:block;width:100%;height:100%;"></canvas>

  <div ref="{{ hintRef }}" style="position:absolute;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:9px 18px 9px 13px;border-radius:999px;background:rgba(251,246,234,.93);box-shadow:0 3px 16px rgba(45,38,20,.2);font-size:14.5px;font-weight:600;letter-spacing:.2px;color:#5A6151;pointer-events:none;transition:opacity .9s ease;white-space:nowrap;">
    <span style="width:10px;height:10px;border-radius:50%;background:#14657F;"></span>
    Drag to look around · tap an animal
  </div>

  <button ref="{{ homeRef }}" onClick="{{ goHome }}" style="position:absolute;right:18px;bottom:calc(104px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;padding:11px 19px 11px 13px;border:1px solid #E2D8BE;border-radius:999px;background:#FBF6EA;color:#14657F;font-family:Karla,system-ui,sans-serif;font-size:15px;font-weight:700;letter-spacing:.2px;box-shadow:0 5px 18px rgba(45,38,20,.26);opacity:0;pointer-events:none;transition:opacity .35s ease;">
    <span style="display:flex;align-items:center;justify-content:center;width:15px;height:15px;border:2px solid #14657F;border-radius:50%;">
      <span style="width:5px;height:5px;border-radius:50%;background:#14657F;"></span>
    </span>
    Back to my group
  </button>

  <div style="position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;gap:13px;padding:64px 28px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(28,33,22,.82),rgba(28,33,22,.5) 46%,rgba(28,33,22,0));pointer-events:none;">
    <span style="flex:0 0 auto;width:13px;height:13px;margin-bottom:9px;border:2px solid #7FCADD;border-radius:50%;"></span>
    <span ref="{{ logRef }}" style="font-family:Petrona,Georgia,serif;font-weight:500;font-size:24px;line-height:1.28;letter-spacing:.1px;color:#F8F3E5;text-shadow:0 2px 9px rgba(0,0,0,.6);text-wrap:pretty;">{{ logLine }}</span>
  </div>

  <div ref="{{ sheetRef }}" style="position:absolute;left:0;right:0;bottom:0;z-index:40;transform:translateY(104%);transition:transform .42s cubic-bezier(.2,.9,.28,1);background:#FBF6EA;border-radius:28px 28px 0 0;box-shadow:0 -14px 50px rgba(38,32,18,.4);max-height:94%;overflow-y:auto;-webkit-overflow-scrolling:touch;">
    <div style="display:flex;justify-content:center;padding:10px 0 0;">
      <div style="width:46px;height:5px;border-radius:99px;background:#E0D4B8;"></div>
    </div>
    <button onClick="{{ closeCard }}" style="position:absolute;top:14px;right:14px;z-index:3;width:44px;height:44px;border:none;border-radius:50%;background:#FBF6EA;color:#4A4636;font-size:19px;line-height:1;box-shadow:0 3px 12px rgba(38,32,18,.26);">✕</button>

    <div style="display:flex;flex-wrap:wrap;gap:8px 28px;padding:8px 26px calc(26px + env(safe-area-inset-bottom));">

      <div style="flex:1 1 380px;min-width:290px;">
        <canvas ref="{{ plateRef }}" style="display:block;width:100%;height:auto;border-radius:18px;"></canvas>
      </div>

      <div style="flex:1 1 330px;min-width:290px;padding-top:14px;">
        <div style="font-size:11.5px;font-weight:700;letter-spacing:1.7px;text-transform:uppercase;color:#A09477;">{{ eyebrow }}</div>

        <div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 14px;margin-top:5px;">
          <h2 style="margin:0;font-family:Petrona,Georgia,serif;font-size:35px;font-weight:600;letter-spacing:-.5px;line-height:1.05;color:#2B3026;">{{ name }}</h2>
          <sc-if value="{{ isMine }}" hint-placeholder-val="{{ true }}">
            <span style="display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 9px;border-radius:999px;background:#DCEDF2;color:#0F5266;font-size:12px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;">
              <span style="width:9px;height:9px;border:2px solid #14657F;border-radius:50%;"></span>
              Your group
            </span>
          </sc-if>
          <sc-if value="{{ isOther }}" hint-placeholder-val="{{ false }}">
            <span style="padding:5px 12px;border-radius:999px;background:#EDE6D4;color:#7E765E;font-size:12px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;">Another group</span>
          </sc-if>
        </div>

        <p style="margin:11px 0 0;font-family:Petrona,Georgia,serif;font-size:19px;font-style:italic;line-height:1.45;color:#5C5847;text-wrap:pretty;">{{ blurb }}</p>

        <sc-if value="{{ hasNew }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;align-items:center;gap:12px;margin-top:15px;padding:11px 16px;border-radius:14px;background:#14657F;color:#EFFAFD;">
            <span style="font-size:10.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;opacity:.72;">Just changed</span>
            <span style="font-family:Petrona,Georgia,serif;font-size:20px;font-weight:600;">{{ newLabel }}</span>
          </div>
        </sc-if>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:18px;border:1px solid #E7DDC5;border-radius:16px;background:#E7DDC5;overflow:hidden;">
          <sc-for list="{{ rows }}" as="row" hint-placeholder-count="6">
            <div style="display:flex;flex-direction:column;gap:3px;padding:12px 15px;background:#FBF6EA;">
              <span style="font-size:10.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#A79B7C;">{{ row.label }}</span>
              <span style="display:flex;align-items:center;gap:8px;font-family:Petrona,Georgia,serif;font-size:20px;font-weight:500;color:#2B3026;">
                {{ row.value }}
                <sc-if value="{{ row.hot }}" hint-placeholder-val="{{ false }}">
                  <span style="width:9px;height:9px;border-radius:50%;background:#14657F;"></span>
                </sc-if>
              </span>
            </div>
          </sc-for>
        </div>

        <div style="margin-top:16px;padding-top:14px;border-top:1px solid #E7DDC5;font-family:Petrona,Georgia,serif;font-size:18px;color:#5C5847;">{{ countLine }}</div>
      </div>

    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;lineageMark&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;halo ring&quot;, &quot;halo + caret&quot;, &quot;caret only&quot;, &quot;bracket ticks&quot;, &quot;none&quot;], &quot;default&quot;: &quot;halo ring&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Lineage identity&quot; },
  &quot;grayPresence&quot;: { &quot;editor&quot;: &quot;range&quot;, &quot;min&quot;: 0.4, &quot;max&quot;: 1.3, &quot;step&quot;: 0.05, &quot;default&quot;: 1, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Lineage identity&quot; },
  &quot;creatureScale&quot;: { &quot;editor&quot;: &quot;range&quot;, &quot;min&quot;: 0.8, &quot;max&quot;: 1.6, &quot;step&quot;: 0.05, &quot;default&quot;: 1, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;World&quot; },
  &quot;classroomLight&quot;: { &quot;editor&quot;: &quot;range&quot;, &quot;min&quot;: 0, &quot;max&quot;: 1, &quot;step&quot;: 0.05, &quot;default&quot;: 0.35, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;World&quot; },
  &quot;portraitFrame&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;field plate&quot;, &quot;hand lens&quot;], &quot;default&quot;: &quot;field plate&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Creature card&quot; }
}">
class Component extends DCLogic {
  state = { logLine: "", card: null };

  /* ================= lifecycle ================= */
  componentDidMount(){
    this.TAU = Math.PI * 2;
    this.W = 2900; this.H = 2050;
    this.seedRng(20260802);
    this.buildTraits();
    this.buildWorld();
    this.setupCanvas();
    this.bindInput();
    this.centerOnFollowed(true);
    this.say("Your group lives high up in the leaves.");
    this.paintTerrain();
    this.last = performance.now();
    this.step = (t) => {
      if(this.dead) return;
      try { this.frame(t); } catch(err){ console.error("lineage frame failed", err); return; }
      this.raf = requestAnimationFrame(this.step);
    };
    this.raf = requestAnimationFrame(this.step);
  }
  componentWillUnmount(){
    cancelAnimationFrame(this.raf);
    removeEventListener("resize", this.onResize);
    this.dead = true;
  }
  componentDidUpdate(){
    if(this.logEl){ this.logEl.style.animation = "none"; void this.logEl.offsetWidth; this.logEl.style.animation = "lgIn .55s ease both"; }
  }

  renderVals(){
    const c = this.state.card;
    return {
      stageRef: e => this.stageEl = e,
      worldRef: e => this.cv = e,
      plateRef: e => this.plateEl = e,
      sheetRef: e => this.sheetEl = e,
      logRef:   e => this.logEl = e,
      hintRef:  e => this.hintEl = e,
      homeRef:  e => this.homeEl = e,
      logLine:  this.state.logLine || "",
      eyebrow:  c ? c.eyebrow : "",
      name:     c ? c.name : "",
      blurb:    c ? c.blurb : "",
      isMine:   !!(c && c.mine),
      isOther:  !!(c && !c.mine),
      hasNew:   !!(c && c.newLabel),
      newLabel: c ? (c.newLabel || "") : "",
      rows:     c ? c.rows : [],
      countLine: c ? c.countLine : "",
      closeCard: () => this.closeCard(),
      goHome: () => { this.centerOnFollowed(false); this.hideHint(); }
    };
  }

  /* ================= random ================= */
  mul(s){ let a = s|0; return function(){ a|=0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1|a); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; }; }
  seedRng(s){
    this._r = this.mul(s);
    this.rr = (a,b) => a + this._r()*(b-a);
    this.ri = (a,b) => Math.floor(a + this._r()*(b-a+1));
    this.pick = a => a[Math.floor(this._r()*a.length)];
  }
  clamp(v,a,b){ return v<a?a:v>b?b:v; }

  /* ================= noise & terrain field ================= */
  hash2(x,y,s){ const n = Math.sin(x*127.1 + y*311.7 + s*74.7) * 43758.5453; return n - Math.floor(n); }
  vnoise(x,y,s){
    const xi = Math.floor(x), yi = Math.floor(y), xf = x-xi, yf = y-yi;
    const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
    const a = this.hash2(xi,yi,s), b = this.hash2(xi+1,yi,s), c = this.hash2(xi,yi+1,s), d = this.hash2(xi+1,yi+1,s);
    return a + (b-a)*u + (c-a)*v + (a-b-c+d)*u*v;
  }
  fbm(x,y,s){ let v=0, amp=.55, f=1; for(let i=0;i<3;i++){ v += amp*this.vnoise(x*f, y*f, s+i*17); amp*=.5; f*=2.05; } return v; }

  /* Bands run roughly across the world and never fold back on themselves:
     the vertical term always dominates, so every zone edge is one clean,
     wandering coastline instead of closed islands. */
  zoneT(x,y){
    const W=this.W, H=this.H;
    return 0.24*(x/W) + 1.20*(y/H)
      + 0.070*Math.sin(x/380 + 0.6)
      + 0.055*Math.sin(y/330 + 2.2)
      + 0.045*Math.sin((x*0.8 + y*0.9)/520)
      + 0.030*Math.sin(x/150 + y/190);
  }
  zoneAt(x,y){ const t=this.zoneT(x,y); return t<0.42 ? "canopy" : t<0.80 ? "floor" : t<1.12 ? "shore" : "water"; }
  /* direction along a zone boundary (used for beach & water banding) */
  isoAngle(x,y){
    const W=this.W, H=this.H;
    const q = Math.cos((x*0.8 + y*0.9)/520)/520, p = Math.cos(x/150 + y/190);
    const dx = 0.24/W + 0.070*Math.cos(x/380+0.6)/380 + 0.045*0.8*q + 0.030*p/150;
    const dy = 1.20/H + 0.055*Math.cos(y/330+2.2)/330 + 0.045*0.9*q + 0.030*p/190;
    return Math.atan2(dx, -dy);
  }

  RAMP(){ return [
    [-0.25,[ 38, 70, 48]], [ 0.10,[ 47, 84, 52]], [ 0.26,[ 60, 99, 57]],
    [ 0.38,[ 82,116, 62]], [ 0.46,[122,127, 72]], [ 0.54,[152,131, 79]],
    [ 0.66,[169,145, 92]], [ 0.78,[186,161,108]], [ 0.86,[205,183,133]],
    [ 0.94,[228,212,174]], [ 1.02,[240,228,197]], [ 1.078,[226,211,178]],
    [ 1.126,[196,188,162]], [ 1.16,[145,193,199]], [ 1.30,[ 96,158,180]],
    [ 1.72,[ 62,116,148]]
  ]; }
  ramp(t){
    const S = this._ramp || (this._ramp = this.RAMP());
    if(t <= S[0][0]) return S[0][1];
    for(let i=1;i<S.length;i++){
      if(t <= S[i][0]){
        const a=S[i-1], b=S[i], k=(t-a[0])/(b[0]-a[0]), e=k*k*(3-2*k);
        return [a[1][0]+(b[1][0]-a[1][0])*e, a[1][1]+(b[1][1]-a[1][1])*e, a[1][2]+(b[1][2]-a[1][2])*e];
      }
    }
    return S[S.length-1][1];
  }
  rgba(c, dl, a){
    const k = v => Math.max(0, Math.min(255, Math.round(v + dl)));
    return "rgba(" + k(c[0]) + "," + k(c[1]) + "," + k(c[2]) + "," + a.toFixed(3) + ")";
  }

  /* ================= traits ================= */
  buildTraits(){
    this.TRAITS = [
      { k:"bodySize",  label:"Body",  words:["small","middling","large"],   phrase:["a smaller body","a middling body","a bigger body"] },
      { k:"feet",      label:"Feet",  words:["narrow","broad","webbed"],    phrase:["narrow feet","broad feet","webbed feet"] },
      { k:"legLength", label:"Legs",  words:["stubby","even","long"],       phrase:["stubby legs","even legs","long legs"] },
      { k:"eyes",      label:"Eyes",  words:["beady","round","huge"],       phrase:["beady eyes","round eyes","huge eyes"] },
      { k:"coat",      label:"Coat",  words:["sleek","soft","shaggy"],      phrase:["a sleek coat","a soft coat","a shaggy coat"] },
      { k:"tail",      label:"Tail",  words:["stubby","curved","long"],     phrase:["a stubby tail","a curved tail","a long tail"] },
      { k:"snout",     label:"Nose",  words:["snub","even","long"],         phrase:["a snub nose","an even nose","a long nose"] },
      { k:"ears",      label:"Ears",  words:["tiny","round","wide"],        phrase:["tiny ears","round ears","wide ears"] },
      { k:"grip",      label:"Grip",  words:["weak","steady","strong"],     phrase:["a weak grip","a steady grip","a strong grip"] },
      { k:"tint",      label:"Colour",words:["pale","warm","dark"],         phrase:["pale colouring","warm colouring","dark colouring"] }
    ];
    this.TR = {}; for(const t of this.TRAITS) this.TR[t.k] = t;
    this.ZONE_LABEL = { canopy:"The high leaves", floor:"The open ground", shore:"The water's edge", water:"The water" };
    this.NAMES = ["Pebble","Fernback","Mosstoe","Driftwood","Acorn","Willow","Thistle","Bramble","Clover","Hollow","Reed","Birch","Sorrel","Cobble","Tumble","Nettle"];
  }
  newGenome(bias){
    const g = {};
    for(const t of this.TRAITS) g[t.k] = this.ri(0,2);
    if(bias) Object.assign(g, bias);
    return g;
  }

  /* ================= world ================= */
  buildWorld(){
    const cl = (v,a,b) => this.clamp(v,a,b);
    this.creatures = [];
    let cx = this.W*0.28, cy = this.H*0.24;
    for(let i=0;i<6000;i++){
      const x = this.rr(360, this.W-360), y = this.rr(360, this.H-360);
      if(this.zoneAt(x,y) === "canopy" && this.zoneT(x,y) < 0.26){ cx=x; cy=y; break; }
    }
    this.followedFam = { name: this.pick(this.NAMES), zone:"canopy" };
    const base = this.newGenome({ grip:2, feet:0, bodySize:1, tail:2 });
    for(let i=0;i<20;i++){
      const a = this.rr(0,this.TAU), d = this.rr(0,220);
      const x = cl(cx+Math.cos(a)*d, 40, this.W-40), y = cl(cy+Math.sin(a)*d*0.82, 40, this.H-40);
      const g = Object.assign({}, base);
      for(const t of this.TRAITS) if(this._r() < 0.30) g[t.k] = cl(g[t.k] + (this._r()<.5?-1:1), 0, 2);
      this.creatures.push(this.makeCreature(x,y,this.followedFam,g,true));
    }
    const fams = [];
    for(let i=0;i<12;i++){
      let x=0,y=0,z="water",tries=0;
      while(z==="water" && tries++<500){ x=this.rr(200,this.W-200); y=this.rr(200,this.H-200); z=this.zoneAt(x,y); }
      fams.push({ name:this.pick(this.NAMES), zone:z, cx:x, cy:y,
        genome:this.newGenome(z==="shore"?{feet:2,coat:0,legLength:1}:z==="canopy"?{grip:2,tail:2}:{legLength:2,ears:2}) });
    }
    for(const f of fams){
      const n = this.ri(11,20);
      for(let i=0;i<n;i++){
        const a = this.rr(0,this.TAU), d = this.rr(0, this.rr(150,300));
        const x = cl(f.cx+Math.cos(a)*d, 30, this.W-30), y = cl(f.cy+Math.sin(a)*d*0.82, 30, this.H-30);
        if(this.zoneAt(x,y) === "water") continue;
        const g = Object.assign({}, f.genome);
        for(const t of this.TRAITS) if(this._r() < 0.34) g[t.k] = cl(g[t.k] + (this._r()<.5?-1:1), 0, 2);
        this.creatures.push(this.makeCreature(x,y,f,g,false));
      }
    }
    this.cam = { x:0, y:0 };
    this.adaptTimer = 7600;
    this.newsTimer  = 15000;
    this.logQueue = [];
    this.logTimer = 0;
  }
  makeCreature(x,y,fam,genome,followed){
    return { x, y, vx:this.rr(-.2,.2), vy:this.rr(-.2,.2), hd:this.rr(0,this.TAU),
      fam, genome, followed, home:{x,y}, ph:this.rr(0,this.TAU), face:this._r()<.5?-1:1,
      seed:(this._r()*1e9)|0, mode:"walk", modeT:this.rr(600,4200),
      flash:0, newTrait:null };
  }

  /* ================= canvas ================= */
  setupCanvas(){
    this.ctx = this.cv.getContext("2d");
    this.onResize = () => {
      this.DPR = Math.min(devicePixelRatio || 1, 2);
      this.vw = this.stageEl.clientWidth; this.vh = this.stageEl.clientHeight;
      this.cv.width = Math.floor(this.vw*this.DPR); this.cv.height = Math.floor(this.vh*this.DPR);
      this.ctx.setTransform(this.DPR,0,0,this.DPR,0,0);
      this.clampCam();
    };
    addEventListener("resize", this.onResize);
    this.onResize();
  }

  /* ================= terrain ================= */
  nextFrame(){ return new Promise(r => requestAnimationFrame(() => setTimeout(r,0))); }
  async paintTerrain(){
    const t = document.createElement("canvas");
    t.width = this.W; t.height = this.H;
    const g = t.getContext("2d");
    this.terrain = t;
    this.paintBase(g);      await this.nextFrame(); if(this.dead) return;
    this.paintStrokes(g);   await this.nextFrame(); if(this.dead) return;
    this.paintCanopy(g);    await this.nextFrame(); if(this.dead) return;
    this.paintFloor(g);     await this.nextFrame(); if(this.dead) return;
    this.paintShore(g);     await this.nextFrame(); if(this.dead) return;
    this.paintGlaze(g);
  }

  paintBase(g){
    const SC = 10, W = this.W, H = this.H;
    const lw = Math.ceil(W/SC), lh = Math.ceil(H/SC);
    const lc = document.createElement("canvas"); lc.width = lw; lc.height = lh;
    const lg = lc.getContext("2d");
    const img = lg.createImageData(lw,lh), d = img.data;
    for(let y=0;y<lh;y++) for(let x=0;x<lw;x++){
      const wx = x*SC, wy = y*SC;
      let t = this.zoneT(wx,wy)
        + (this.fbm(wx/240, wy/240, 7) - 0.5)*0.135
        + (this.fbm(wx/64,  wy/64,  3) - 0.5)*0.05;
      const c = this.ramp(t);
      const L = 0.93 + this.fbm(wx/620, wy/620, 23)*0.17;
      const i = (y*lw + x)*4;
      d[i]   = Math.min(255, c[0]*L);
      d[i+1] = Math.min(255, c[1]*L);
      d[i+2] = Math.min(255, c[2]*L);
      d[i+3] = 255;
    }
    lg.putImageData(img,0,0);
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
    g.drawImage(lc, 0, 0, lw, lh, 0, 0, lw*SC, lh*SC);
  }

  strokeAngle(x,y,t){
    if(t > 1.02) return this.isoAngle(x,y);
    return (this.fbm(x/330, y/330, 41) - 0.5) * Math.PI * 3.2;
  }
  paintStrokes(g){
    const W=this.W, H=this.H, rr=this.rr;
    g.lineCap = "round";
    for(let i=0;i<6000;i++){
      const x = rr(0,W), y = rr(0,H);
      const t = this.zoneT(x,y);
      const c = this.ramp(t);
      const a = this.strokeAngle(x,y,t);
      const beach = t > 0.82;
      const len = beach ? rr(46,190) : rr(16,64);
      const lwd = beach ? rr(2.2,8) : rr(3,13);
      const dl  = rr(-28,30);
      g.strokeStyle = this.rgba(c, dl, rr(.05, beach ? .13 : .17));
      g.lineWidth = lwd;
      const nx = Math.cos(a), ny = Math.sin(a), off = rr(-11,11);
      g.beginPath();
      g.moveTo(x - nx*len/2, y - ny*len/2);
      g.quadraticCurveTo(x - ny*off, y + nx*off, x + nx*len/2, y + ny*len/2);
      g.stroke();
    }
  }

  organic(g, x, y, rx, ry, rot, wob, n){
    const pts = [];
    for(let i=0;i<n;i++){
      const a = i/n*this.TAU, k = 1 + (this._r()-0.5)*2*wob;
      const px = Math.cos(a)*rx*k, py = Math.sin(a)*ry*k;
      pts.push([px*Math.cos(rot) - py*Math.sin(rot) + x, px*Math.sin(rot) + py*Math.cos(rot) + y]);
    }
    g.beginPath();
    g.moveTo((pts[0][0]+pts[n-1][0])/2, (pts[0][1]+pts[n-1][1])/2);
    for(let i=0;i<n;i++){
      const p = pts[i], q = pts[(i+1)%n];
      g.quadraticCurveTo(p[0], p[1], (p[0]+q[0])/2, (p[1]+q[1])/2);
    }
    g.closePath();
  }

  paintCanopy(g){
    const rr = this.rr, W = this.W, H = this.H;
    const GREENS = [[36,63,41],[48,80,48],[60,97,55],[76,116,63],[95,137,73],[118,159,88],[141,178,104]];
    const trees = [];
    for(let i=0;i<2400;i++){
      const x = rr(-90,W+90), y = rr(-90,H+90);
      const t = this.zoneT(x,y);
      if(t > 0.60) continue;
      /* thinning out into the open ground gives a ragged, real tree line */
      if(this._r() > this.clamp((0.60 - t)/0.18, 0, 1)) continue;
      const u = this._r();
      const r = u < 0.10 ? rr(62,110) : u < 0.46 ? rr(34,58) : rr(16,32);
      trees.push({ x, y, r, lv: this.ri(0,2) });
    }
    trees.sort((a,b) => a.y - b.y);
    for(const T of trees){
      const r = T.r;
      g.globalAlpha = 0.42;
      g.fillStyle = "rgb(26,45,30)";
      this.organic(g, T.x + r*0.26, T.y + r*0.34, r*1.02, r*0.9, 0, .16, 10); g.fill();
      g.globalAlpha = 1;
      const n = r > 60 ? 9 : r > 34 ? 6 : 4;
      for(let k=0;k<n;k++){
        const a = (k/n)*this.TAU + this.rr(-0.4,0.4);
        const d = k === 0 ? 0 : r*this.rr(0.26,0.54);
        const cx2 = T.x + Math.cos(a)*d, cy2 = T.y + Math.sin(a)*d*0.86;
        const lit = this.clamp(0.5 - (Math.cos(a)*0.5 + Math.sin(a)*0.55), 0, 1);
        const idx = this.clamp(Math.round(T.lv + lit*3.2 - 0.4), 0, 6);
        g.globalAlpha = 0.88 + this._r()*0.12;
        g.fillStyle = this.rgba(GREENS[idx], this.rr(-9,9), 1);
        const rc = r * this.rr(0.42, 0.62);
        this.organic(g, cx2, cy2, rc, rc*this.rr(0.78,0.98), this.rr(0,3), .26, 9); g.fill();
      }
      g.globalAlpha = 0.40;
      g.strokeStyle = this.rgba(GREENS[this.clamp(T.lv+1,0,6)], 0, 1);
      g.lineWidth = this.rr(2,4.4); g.lineCap = "round";
      for(let k=0;k<5;k++){
        const a = this.rr(0,this.TAU), d = r*this.rr(0.72,0.94);
        g.beginPath();
        g.moveTo(T.x + Math.cos(a)*d, T.y + Math.sin(a)*d*0.86);
        g.lineTo(T.x + Math.cos(a)*d*1.16, T.y + Math.sin(a)*d*1.08);
        g.stroke();
      }
      g.globalAlpha = 1;
    }
    for(let i=0;i<320;i++){
      const x = rr(0,W), y = rr(0,H);
      if(this.zoneT(x,y) > 0.50) continue;
      const r = rr(12,54);
      const grd = g.createRadialGradient(x,y,0,x,y,r);
      grd.addColorStop(0, "rgba(255,244,196,0.30)");
      grd.addColorStop(0.5, "rgba(255,240,188,0.10)");
      grd.addColorStop(1, "rgba(255,238,184,0)");
      g.fillStyle = grd;
      g.beginPath(); g.arc(x,y,r,0,this.TAU); g.fill();
    }
  }

  paintFloor(g){
    const rr = this.rr, W = this.W, H = this.H;
    g.lineCap = "round";
    /* broad tonal patches so the ground is never one flat colour */
    for(let i=0;i<1100;i++){
      const x = rr(0,W), y = rr(0,H), t = this.zoneT(x,y);
      if(t < 0.40 || t > 0.94) continue;
      const c = this.ramp(t);
      g.globalAlpha = rr(.06,.20);
      g.fillStyle = this.rgba(c, rr(-44, 30), 1);
      this.organic(g, x, y, rr(40,160), rr(28,105), rr(0,3), .3, 10); g.fill();
    }
    g.globalAlpha = 1;
    /* grass and moss, thicker up near the trees */
    for(let i=0;i<3200;i++){
      const x = rr(0,W), y = rr(0,H), t = this.zoneT(x,y);
      if(t < 0.40 || t > 0.88) continue;
      if(this._r() > this.clamp((0.92 - t)/0.36, 0.06, 1)) continue;
      const green = [[74,104,56],[92,122,64],[112,140,76],[136,158,92]][this.ri(0,3)];
      g.strokeStyle = this.rgba(green, rr(-12,12), rr(.35,.78));
      g.lineWidth = rr(1.5, 3);
      const n = this.ri(3,6), s2 = rr(8, 24);
      for(let k=0;k<n;k++){
        const a = -Math.PI/2 + rr(-1.2, 1.2);
        g.beginPath(); g.moveTo(x, y);
        g.quadraticCurveTo(x + Math.cos(a)*s2*0.5, y + Math.sin(a)*s2*0.8, x + Math.cos(a)*s2*1.05, y + Math.sin(a)*s2*1.15);
        g.stroke();
      }
    }
    /* leaf litter */
    const LEAF = [[150,104,52],[170,128,64],[132,92,46],[188,152,82],[118,116,58]];
    for(let i=0;i<11000;i++){
      const x = rr(0,W), y = rr(0,H), t = this.zoneT(x,y);
      if(t < 0.36 || t > 0.92) continue;
      if(this._r() > this.clamp((0.96 - t)/0.42, 0.08, 1)) continue;
      g.fillStyle = this.rgba(LEAF[this.ri(0,4)], rr(-22, 26), rr(.24,.62));
      const a = rr(0, this.TAU), l = rr(6, 15);
      g.save(); g.translate(x,y); g.rotate(a);
      g.beginPath();
      g.moveTo(-l, 0);
      g.quadraticCurveTo(0, -l*0.52, l, 0);
      g.quadraticCurveTo(0, l*0.52, -l, 0);
      g.fill();
      g.restore();
    }
    /* stones */
    for(let i=0;i<300;i++){
      const x = rr(0,W), y = rr(0,H), t = this.zoneT(x,y);
      if(t < 0.44 || t > 0.94) continue;
      const r = rr(3, 9), a = rr(0,this.TAU), v = rr(-16,16);
      g.globalAlpha = .2; g.fillStyle = "rgb(74,64,48)";
      g.beginPath(); g.ellipse(x + r*0.35, y + r*0.42, r, r*0.74, a, 0, this.TAU); g.fill();
      g.globalAlpha = 1;
      g.fillStyle = "rgb(" + ((146+v)|0) + "," + ((132+v)|0) + "," + ((108+v)|0) + ")";
      this.organic(g, x, y, r, r*0.76, a, .2, 9); g.fill();
      g.globalAlpha = .3; g.fillStyle = "rgb(208,198,174)";
      this.organic(g, x - r*0.22, y - r*0.26, r*0.5, r*0.34, a, .25, 8); g.fill();
      g.globalAlpha = 1;
    }
    /* fallen logs, mostly near the forest */
    for(let i=0;i<90;i++){
      const x = rr(0,W), y = rr(0,H), t = this.zoneT(x,y);
      if(t < 0.42 || t > 0.86) continue;
      if(this._r() > this.clamp((0.86 - t)/0.30, 0.04, 1)) continue;
      const a = rr(0,this.TAU), l = rr(60,160), w = rr(7,12), v = rr(-14,14);
      g.save(); g.translate(x,y); g.rotate(a);
      g.globalAlpha = .22; g.fillStyle = "rgb(54,44,30)";
      g.beginPath(); g.ellipse(5, w, l/2, w*0.8, 0, 0, this.TAU); g.fill();
      g.globalAlpha = 1;
      g.fillStyle = "rgb(" + ((96+v)|0) + "," + ((78+v)|0) + "," + ((55+v)|0) + ")";
      g.beginPath(); g.ellipse(0, 0, l/2, w, 0, 0, this.TAU); g.fill();
      g.globalAlpha = .6;
      g.fillStyle = "rgb(" + ((142+v)|0) + "," + ((120+v)|0) + "," + ((85+v)|0) + ")";
      g.beginPath(); g.ellipse(-l*0.03, -w*0.36, l/2.3, w*0.3, 0, 0, this.TAU); g.fill();
      g.globalAlpha = .24; g.strokeStyle = "rgb(64,52,36)"; g.lineWidth = 1.5;
      for(let k=0;k<3;k++){
        const yy = -w*0.6 + k*w*0.4;
        g.beginPath(); g.moveTo(-l*0.44, yy); g.lineTo(l*0.44, yy + rr(-2,2)); g.stroke();
      }
      g.globalAlpha = 1;
      g.fillStyle = "rgb(" + ((160+v)|0) + "," + ((134+v)|0) + "," + ((97+v)|0) + ")";
      g.beginPath(); g.ellipse(l/2, 0, w*0.34, w*0.94, 0, 0, this.TAU); g.fill();
      g.restore();
    }
    g.globalAlpha = 1;
  }

  paintShore(g){
    const rr = this.rr, W = this.W, H = this.H;
    g.lineCap = "round";
    /* raked tide lines running parallel to the water */
    for(let i=0;i<5200;i++){
      const x = rr(0,W), y = rr(0,H), t = this.zoneT(x,y);
      if(t < 0.80 || t > 1.17) continue;
      const c = this.ramp(t);
      const a = this.isoAngle(x,y), l = rr(80, 340);
      g.strokeStyle = this.rgba(c, rr(-20, 24), rr(.04,.14));
      g.lineWidth = rr(2, 9);
      g.beginPath();
      g.moveTo(x - Math.cos(a)*l/2, y - Math.sin(a)*l/2);
      g.quadraticCurveTo(x + Math.sin(a)*rr(-8,8), y - Math.cos(a)*rr(-8,8), x + Math.cos(a)*l/2, y + Math.sin(a)*l/2);
      g.stroke();
    }
    /* damp sand — broad soft washes */
    for(let i=0;i<1500;i++){
      const x = rr(0,W), y = rr(0,H), t = this.zoneT(x,y);
      if(t < 1.03 || t > 1.128) continue;
      g.globalAlpha = rr(.04,.13);
      g.fillStyle = "rgb(150,146,126)";
      this.organic(g, x, y, rr(60,200), rr(10,28), this.isoAngle(x,y), .32, 11); g.fill();
    }
    g.globalAlpha = 1;
    /* foam at the waterline */
    for(let i=0;i<4600;i++){
      const x = rr(0,W), y = rr(0,H), t = this.zoneT(x,y);
      if(Math.abs(t - 1.126) > 0.012) continue;
      const a = this.isoAngle(x,y), l = rr(14,70);
      g.strokeStyle = "rgba(255,253,246," + rr(.18,.66).toFixed(3) + ")";
      g.lineWidth = rr(1.4, 6);
      g.beginPath();
      g.moveTo(x - Math.cos(a)*l/2, y - Math.sin(a)*l/2);
      g.quadraticCurveTo(x + Math.sin(a)*rr(-10,10), y - Math.cos(a)*rr(-10,10), x + Math.cos(a)*l/2, y + Math.sin(a)*l/2);
      g.stroke();
    }
    /* shells and pebbles, gathered along the tide line */
    for(let i=0;i<3000;i++){
      const x = rr(0,W), y = rr(0,H), t = this.zoneT(x,y);
      if(t < 0.90 || t > 1.13) continue;
      if(this._r() > 1 - Math.abs(t - 1.10)/0.23) continue;
      const r = rr(1.8, 7), a = rr(0,this.TAU), c = this.ramp(t);
      g.globalAlpha = .2; g.fillStyle = "rgb(118,108,86)";
      g.beginPath(); g.ellipse(x + r*0.4, y + r*0.5, r, r*0.72, a, 0, this.TAU); g.fill();
      g.globalAlpha = rr(.5,.95);
      g.fillStyle = this.rgba(c, rr(-62, -14), 1);
      g.beginPath(); g.ellipse(x, y, r, r*0.72, a, 0, this.TAU); g.fill();
      g.globalAlpha = rr(.3,.75); g.fillStyle = "rgb(255,250,236)";
      g.beginPath(); g.ellipse(x - r*0.24, y - r*0.28, r*0.42, r*0.28, a, 0, this.TAU); g.fill();
    }
    g.globalAlpha = 1;
    /* driftwood along the strand line */
    for(let i=0;i<70;i++){
      const x = rr(0,W), y = rr(0,H), t = this.zoneT(x,y);
      if(t < 0.98 || t > 1.12) continue;
      const a = this.isoAngle(x,y) + rr(-0.8,0.8), l = rr(40,130), w = rr(4,9), v = rr(-12,12);
      g.save(); g.translate(x,y); g.rotate(a);
      g.globalAlpha = .18; g.fillStyle = "rgb(90,80,62)";
      g.beginPath(); g.ellipse(3, w*0.9, l/2, w*0.8, 0, 0, this.TAU); g.fill();
      g.globalAlpha = 1;
      g.fillStyle = "rgb(" + ((158+v)|0) + "," + ((142+v)|0) + "," + ((116+v)|0) + ")";
      g.beginPath(); g.ellipse(0, 0, l/2, w, 0, 0, this.TAU); g.fill();
      g.globalAlpha = .55; g.fillStyle = "rgb(206,194,168)";
      g.beginPath(); g.ellipse(0, -w*0.34, l/2.3, w*0.3, 0, 0, this.TAU); g.fill();
      g.restore();
    }
    g.globalAlpha = 1;
    /* water */
    for(let i=0;i<3600;i++){
      const x = rr(0,W), y = rr(0,H), t = this.zoneT(x,y);
      if(t < 1.12) continue;
      const a = this.isoAngle(x,y), l = rr(50, 280), c = this.ramp(t);
      g.strokeStyle = this.rgba(c, rr(-26, 46), rr(.06,.2));
      g.lineWidth = rr(2, 10);
      g.beginPath();
      g.moveTo(x - Math.cos(a)*l/2, y - Math.sin(a)*l/2);
      g.quadraticCurveTo(x + Math.sin(a)*rr(-12,12), y - Math.cos(a)*rr(-12,12), x + Math.cos(a)*l/2, y + Math.sin(a)*l/2);
      g.stroke();
    }
    /* small crests where the water meets the sand */
    for(let i=0;i<1600;i++){
      const x = rr(0,W), y = rr(0,H), t = this.zoneT(x,y);
      if(t < 1.13 || t > 1.24) continue;
      const a = this.isoAngle(x,y), l = rr(20,90);
      g.strokeStyle = "rgba(240,252,255," + rr(.06,.26).toFixed(3) + ")";
      g.lineWidth = rr(1.6, 4.5);
      g.beginPath();
      g.moveTo(x - Math.cos(a)*l/2, y - Math.sin(a)*l/2);
      g.quadraticCurveTo(x + Math.sin(a)*rr(-8,8), y - Math.cos(a)*rr(-8,8), x + Math.cos(a)*l/2, y + Math.sin(a)*l/2);
      g.stroke();
    }
  }

  grainPattern(g){
    const n = document.createElement("canvas"); n.width = n.height = 180;
    const ng = n.getContext("2d"), im = ng.createImageData(180,180), d = im.data;
    for(let i=0;i<d.length;i+=4){
      const v = 118 + (this._r()-0.5)*90;
      d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255;
    }
    ng.putImageData(im,0,0);
    return g.createPattern(n, "repeat");
  }
  paintGlaze(g){
    const W = this.W, H = this.H;
    /* warm unifying wash — one light, one painting */
    g.globalAlpha = .07; g.fillStyle = "#FFF1D2"; g.fillRect(0,0,W,H);
    /* broad soft light & shade across the whole world */
    const SC = 18, lw = Math.ceil(W/SC), lh = Math.ceil(H/SC);
    const lc = document.createElement("canvas"); lc.width = lw; lc.height = lh;
    const lg = lc.getContext("2d"), img = lg.createImageData(lw,lh), d = img.data;
    for(let y=0;y<lh;y++) for(let x=0;x<lw;x++){
      const v = 96 + this.fbm(x/9.5, y/9.5, 61)*116;
      const i = (y*lw+x)*4;
      d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255;
    }
    lg.putImageData(img,0,0);
    g.globalAlpha = .17; g.globalCompositeOperation = "overlay";
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
    g.drawImage(lc, 0, 0, lw, lh, 0, 0, lw*SC, lh*SC);
    /* paper tooth */
    g.globalAlpha = .05;
    g.fillStyle = this.grainPattern(g);
    g.fillRect(0,0,W,H);
    g.globalCompositeOperation = "source-over";
    g.globalAlpha = 1;
  }

  /* ================= camera ================= */
  clampCam(){
    const vw = this.vw, vh = this.vh;
    this.cam.x = this.clamp(this.cam.x, 0, Math.max(0, this.W - vw));
    this.cam.y = this.clamp(this.cam.y, 0, Math.max(0, this.H - vh));
  }
  followedCentroid(){
    let sx=0, sy=0, n=0;
    for(const c of this.creatures) if(c.followed){ sx+=c.x; sy+=c.y; n++; }
    return n ? { x:sx/n, y:sy/n, n } : null;
  }
  centerOnFollowed(instant){
    const p = this.followedCentroid(); if(!p) return;
    const tx = p.x - this.vw/2, ty = p.y - this.vh/2;
    if(instant){ this.cam.x = tx; this.cam.y = ty; this.clampCam(); }
    else this.camTween = { x:tx, y:ty, t:0 };
  }

  /* ================= narration ================= */
  say(s){ this.logQueue.push(s); if(this.logQueue.length > 4) this.logQueue.shift(); }
  pumpLog(dt){
    this.logTimer -= dt;
    if(this.logTimer <= 0 && this.logQueue.length){
      this.setState({ logLine: this.logQueue.shift() });
      this.logTimer = 5400;
    }
  }

  /* ================= simulation ================= */
  tick(dt){
    const s = dt/16.7, cl = this.clamp;
    const cell = 74, grid = new Map();
    for(const c of this.creatures){
      const k = ((c.x/cell)|0) + "," + ((c.y/cell)|0);
      let a = grid.get(k); if(!a) grid.set(k, a=[]); a.push(c);
    }
    for(const c of this.creatures){
      c.ph += dt * (c.mode === "walk" ? 0.0062 : 0.0021);
      c.modeT -= dt;
      if(c.modeT <= 0){
        const r = this._r();
        c.mode = r < 0.58 ? "walk" : r < 0.85 ? "pause" : "graze";
        c.modeT = c.mode === "walk" ? this.rr(2200, 7000) : this.rr(900, 3200);
      }
      const drive = c.mode === "walk" ? 1 : 0.12;
      c.vx += (this.rr(-1,1))*0.013*drive*s + (c.home.x - c.x)*0.000048*s;
      c.vy += (this.rr(-1,1))*0.013*drive*s + (c.home.y - c.y)*0.000048*s;
      /* gentle personal space so the group reads as many animals, not one blob */
      const gx = (c.x/cell)|0, gy = (c.y/cell)|0;
      for(let ox=-1; ox<=1; ox++) for(let oy=-1; oy<=1; oy++){
        const a = grid.get((gx+ox) + "," + (gy+oy)); if(!a) continue;
        for(const o of a){
          if(o === c) continue;
          const dx = c.x-o.x, dy = c.y-o.y, d2 = dx*dx + dy*dy;
          if(d2 > 0.01 && d2 < 380){ const d = Math.sqrt(d2); c.vx += dx/d*0.03*s; c.vy += dy/d*0.03*s; }
        }
      }
      const sp = Math.hypot(c.vx, c.vy), max = (c.followed ? 0.34 : 0.27) * (c.mode==="walk" ? 1 : 0.35);
      if(sp > max){ c.vx = c.vx/sp*max; c.vy = c.vy/sp*max; }
      c.vx *= 0.995; c.vy *= 0.995;
      c.x += c.vx*s; c.y += c.vy*s;
      if(this.zoneAt(c.x, c.y) === "water"){ c.x -= c.vx*3*s; c.y -= c.vy*3*s; c.vx *= -0.6; c.vy *= -0.6; }
      c.x = cl(c.x, 20, this.W-20); c.y = cl(c.y, 20, this.H-20);
      if(Math.abs(c.vx) > 0.05) c.face = c.vx > 0 ? 1 : -1;
    }

    this.adaptTimer -= dt;
    if(this.adaptTimer <= 0){
      this.adaptTimer = this.rr(9000, 14000);
      const pool = this.creatures.filter(c => c.followed);
      if(pool.length){
        for(const c of this.creatures){ if(c.flash === 2) c.flash = 0; if(c.flash === 1) c.flash = 2; }
        const c = this.pick(pool), t = this.pick(this.TRAITS);
        let nv = cl(c.genome[t.k] + (this._r()<.5?-1:1), 0, 2);
        if(nv === c.genome[t.k]) nv = cl(nv+1, 0, 2);
        c.genome[t.k] = nv; c.newTrait = t.k; c.flash = 1; c.flashT = 0;
        this.say("One of your animals has " + t.phrase[nv] + " now.");
      }
    }
    this.newsTimer -= dt;
    if(this.newsTimer <= 0){
      this.newsTimer = this.rr(17000, 25000);
      this.say(this.pick([
        "A group down by the water is getting bigger.",
        "Two of your animals had babies up in the leaves.",
        "A group out on the open ground is getting smaller.",
        "Something new turned up near the sand.",
        "Your group is about the same size as last time."
      ]));
    }
    for(const c of this.creatures) if(c.flash) c.flashT = (c.flashT||0) + dt;

    if(this.camTween){
      const tw = this.camTween;
      tw.t = Math.min(1, tw.t + dt/620);
      const e = 1 - Math.pow(1-tw.t, 3);
      this.cam.x += (tw.x - this.cam.x)*e*0.3;
      this.cam.y += (tw.y - this.cam.y)*e*0.3;
      if(tw.t >= 1){ this.cam.x = tw.x; this.cam.y = tw.y; this.camTween = null; }
      this.clampCam();
    }
  }

  /* ================= world-scale creature ================= */
  drawCreature(c, scale){
    const x = this.ctx, g = c.genome, mine = c.followed;
    /* side-on figures, flipped by travel direction: at 25px a rotating
       top-down silhouette reads as an insect, a standing animal doesn't —
       and this is the same animal the card portrait shows. */
    const u = (mine ? 9.6 : 7.5) * (0.84 + g.bodySize*0.20) * scale;
    const dir = c.face || 1;
    const gp = this.props.grayPresence === undefined ? 1 : this.props.grayPresence;
    const walk = c.mode === "walk";
    const ph = c.ph*2.0;
    const bob = walk ? Math.abs(Math.sin(ph))*u*0.09 : 0;
    const legL = u*(0.34 + g.legLength*0.30);
    const bRX = u*0.80, bRY = u*0.50, hR = u*0.47;
    const bodyY = -(legL + bRY) - bob;
    const headX = bRX*0.74, headY = bodyY - bRY*0.52 - hR*0.42;
    const nose = hR*(0.78 + g.snout*0.20);

    x.globalAlpha = mine ? 0.26 : 0.14*gp;
    x.fillStyle = "#332F1E";
    x.beginPath(); x.ellipse(c.x + u*0.10, c.y + u*0.06, u*1.05, u*0.30, 0, 0, this.TAU); x.fill();
    x.globalAlpha = 1;

    x.save();
    x.translate(c.x, c.y);
    x.scale(dir, 1);

    const body = mine ? "#1A657E" : "#8E8574";
    const dark = mine ? "#0C3B4D" : "#7C7463";
    const far  = mine ? "#124F65" : "#807867";
    const rim  = mine ? "#8FD2E6" : "#BAB29C";

    const fw = g.feet === 2 ? u*0.34 : g.feet === 1 ? u*0.24 : u*0.15;
    const legW = mine ? u*0.15 : u*0.12;
    const leg = (px, phase, col) => {
      const sw = walk ? Math.sin(ph + phase)*legL*0.40 : 0;
      const lift = walk ? Math.max(0, Math.sin(ph + phase))*u*0.11 : 0;
      x.strokeStyle = col; x.lineWidth = legW; x.lineCap = "round";
      x.beginPath(); x.moveTo(px, bodyY + bRY*0.55); x.lineTo(px + sw, -lift); x.stroke();
      x.beginPath(); x.moveTo(px + sw - fw*0.30, -lift); x.lineTo(px + sw + fw*0.70, -lift); x.stroke();
    };
    /* far pair */
    leg(bRX*0.50 - u*0.16, Math.PI, far);
    leg(-bRX*0.52 - u*0.16, 0, far);

    /* tail */
    const tl = u*(0.22 + g.tail*0.36);
    const sway = Math.sin(c.ph*1.7)*u*0.16;
    x.strokeStyle = dark; x.lineCap = "round"; x.lineWidth = mine ? u*0.13 : u*0.11;
    x.beginPath();
    x.moveTo(-bRX*0.84, bodyY + bRY*0.10);
    x.quadraticCurveTo(-bRX*0.84 - tl*0.95, bodyY + tl*0.10 + sway, -bRX*0.70 - tl*1.00, bodyY - tl*0.72 + sway);
    x.stroke();

    /* one silhouette: body, head, muzzle, ears */
    const P = new Path2D();
    P.ellipse(0, bodyY, bRX, bRY, 0, 0, this.TAU);
    P.ellipse(headX, headY, hR, hR*0.94, 0, 0, this.TAU);
    P.moveTo(headX + hR*0.30, headY - hR*0.34);
    P.quadraticCurveTo(headX + nose*1.18, headY - hR*0.10, headX + nose*1.10, headY + hR*0.30);
    P.quadraticCurveTo(headX + hR*0.50, headY + hR*0.62, headX + hR*0.20, headY + hR*0.50);
    P.closePath();
    if(g.ears > 0){
      const er = u*(0.09 + g.ears*0.085);
      P.ellipse(headX - hR*0.30, headY - hR*0.86, er*0.78, er, -0.25, 0, this.TAU);
      P.ellipse(headX + hR*0.34, headY - hR*0.80, er*0.72, er*0.9, 0.18, 0, this.TAU);
    }
    /* haunch */
    P.ellipse(-bRX*0.46, bodyY + bRY*0.16, bRX*0.50, bRY*0.86, 0, 0, this.TAU);

    if(g.coat === 2){
      x.strokeStyle = mine ? "#1E7086" : "#A69E8C";
      x.lineWidth = u*0.12; x.globalAlpha = mine ? 0.85 : 0.5; x.lineCap = "round";
      for(let k=0;k<10;k++){
        const a = k/10*this.TAU;
        const px = Math.cos(a)*bRX, py = bodyY + Math.sin(a)*bRY;
        x.beginPath(); x.moveTo(px*0.82, bodyY + (py-bodyY)*0.82); x.lineTo(px*1.22, bodyY + (py-bodyY)*1.34); x.stroke();
      }
      x.globalAlpha = 1;
    }

    /* sunlit rim holds its world direction through the flip */
    x.save();
    x.translate(-0.9*dir, -1.0);
    x.fillStyle = rim; x.globalAlpha = mine ? 0.95 : 0.5*gp;
    x.fill(P);
    x.restore();
    x.globalAlpha = mine ? 1 : Math.min(1, 0.82*gp);
    x.fillStyle = body; x.fill(P);
    x.globalAlpha = 1;
    if(mine){ x.strokeStyle = "#08333F"; x.globalAlpha = 0.42; x.lineWidth = u*0.075; x.stroke(P); x.globalAlpha = 1; }

    /* near pair, on top of the body */
    leg(bRX*0.52, 0, dark);
    leg(-bRX*0.46, Math.PI, dark);

    if(mine){
      const eR = u*(0.085 + g.eyes*0.036);
      x.fillStyle = "#F0FAFC";
      x.beginPath(); x.arc(headX + hR*0.30, headY - hR*0.10, eR, 0, this.TAU); x.fill();
      x.fillStyle = "#08333F";
      x.beginPath(); x.arc(headX + hR*0.36, headY - hR*0.08, eR*0.55, 0, this.TAU); x.fill();
    }
    x.restore();

    const topY = c.y + bodyY - bRY - hR*0.6;
    const midY = c.y + bodyY;
    const mark = this.props.lineageMark || "halo ring";
    if(mine && mark !== "none"){
      if(mark === "bracket ticks"){
        x.strokeStyle = "#146A85"; x.globalAlpha = 0.6; x.lineWidth = 2.2; x.lineCap = "round";
        for(let k=0;k<4;k++){
          const a0 = k*this.TAU/4 + 0.36;
          x.beginPath(); x.arc(c.x, midY, u*1.62, a0, a0 + 0.5); x.stroke();
        }
      } else if(mark === "caret only"){
        x.strokeStyle = "#0F566C"; x.globalAlpha = 0.85; x.lineWidth = 2.4; x.lineCap = "round"; x.lineJoin = "round";
        x.beginPath();
        x.moveTo(c.x - u*0.44, topY - u*0.72); x.lineTo(c.x, topY - u*0.22); x.lineTo(c.x + u*0.44, topY - u*0.72);
        x.stroke();
      } else {
        x.strokeStyle = "#1E7E9C"; x.globalAlpha = 0.44; x.lineWidth = 1.7;
        x.beginPath(); x.ellipse(c.x, midY, u*1.58, u*1.46, 0, 0, this.TAU); x.stroke();
        if(mark === "halo + caret"){
          x.strokeStyle = "#0F566C"; x.globalAlpha = 0.8; x.lineWidth = 2.2; x.lineCap = "round"; x.lineJoin = "round";
          x.beginPath();
          x.moveTo(c.x - u*0.44, topY - u*0.98); x.lineTo(c.x, topY - u*0.48); x.lineTo(c.x + u*0.44, topY - u*0.98);
          x.stroke();
        }
      }
      x.globalAlpha = 1;
    }

    /* adaptation flash: newest bright, the one before it dim, older gone */
    if(c.flash){
      const puls = (Math.sin((c.flashT||0)*0.0042) + 1)/2;
      const newest = c.flash === 1;
      const a = newest ? 0.36 + puls*0.44 : 0.12 + puls*0.08;
      const rad = newest ? u*(2.0 + puls*1.2) : u*1.95;
      if(newest){
        const grd = x.createRadialGradient(c.x, midY, 0, c.x, midY, rad*1.7);
        grd.addColorStop(0, "rgba(255,214,138," + (0.24*a).toFixed(3) + ")");
        grd.addColorStop(1, "rgba(255,214,138,0)");
        x.fillStyle = grd;
        x.beginPath(); x.arc(c.x, midY, rad*1.7, 0, this.TAU); x.fill();
      }
      x.strokeStyle = "#FFCE70"; x.globalAlpha = a; x.lineWidth = newest ? 2.8 : 1.4;
      x.beginPath(); x.ellipse(c.x, midY, rad, rad*0.92, 0, 0, this.TAU); x.stroke();
      x.globalAlpha = 1;
    }
  }

  /* ================= frame ================= */
  frame(now){
    const dt = Math.min(48, now - this.last); this.last = now;
    this.tick(dt); this.pumpLog(dt);

    const x = this.ctx, vw = this.vw, vh = this.vh;
    x.setTransform(this.DPR,0,0,this.DPR,0,0);
    x.fillStyle = "#A2977C"; x.fillRect(0,0,vw,vh);
    x.save();
    x.translate(-this.cam.x, -this.cam.y);

    const vx = this.cam.x, vy = this.cam.y;
    if(this.terrain){
      const sx = this.clamp(vx,0,this.W), sy = this.clamp(vy,0,this.H);
      const sw = this.clamp(vw + (vx-sx), 0, this.W-sx), sh = this.clamp(vh + (vy-sy), 0, this.H-sy);
      if(sw > 0 && sh > 0) x.drawImage(this.terrain, sx, sy, sw, sh, sx, sy, sw, sh);
    }

    /* classroom light: a warm lift so the world survives fluorescent tubes */
    const lift = this.props.classroomLight;
    const la = 0.05 + 0.17*(lift === undefined ? 0.35 : lift);
    x.fillStyle = "rgba(255,247,227," + la.toFixed(3) + ")";
    x.fillRect(vx, vy, vw, vh);

    /* home ground — a soft pool of light where your group lives */
    const home = this.followedCentroid();
    if(home){
      const R = 430;
      const grd = x.createRadialGradient(home.x, home.y, 0, home.x, home.y, R);
      grd.addColorStop(0, "rgba(255,246,214,0.20)");
      grd.addColorStop(0.6, "rgba(255,244,208,0.08)");
      grd.addColorStop(1, "rgba(255,244,208,0)");
      x.fillStyle = grd;
      x.beginPath(); x.arc(home.x, home.y, R, 0, this.TAU); x.fill();
    }

    const scale = this.props.creatureScale === undefined ? 1 : this.props.creatureScale;
    const m = 70;
    const vis = [];
    for(const c of this.creatures){
      if(c.x < vx-m || c.x > vx+vw+m || c.y < vy-m || c.y > vy+vh+m) continue;
      vis.push(c);
    }
    vis.sort((a,b) => (a.followed?1:0) - (b.followed?1:0) || a.y - b.y);
    for(const c of vis) this.drawCreature(c, scale);

    x.restore();

    const onScreen = home && home.x > vx && home.x < vx+vw && home.y > vy && home.y < vy+vh;
    const want = !onScreen;
    if(want !== this._homeShown && this.homeEl){
      this._homeShown = want;
      this.homeEl.style.opacity = want ? "1" : "0";
      this.homeEl.style.pointerEvents = want ? "auto" : "none";
    }
  }

  /* ================= input ================= */
  bindInput(){
    const s = this.stageEl;
    this.ptrs = new Map();
    s.addEventListener("pointerdown", e => {
      if(e.target.closest("button")) return;
      s.setPointerCapture(e.pointerId);
      this.ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
      if(this.ptrs.size === 1){ this.dragging = true; this.moved = 0; this.startT = performance.now(); this.camTween = null; }
    });
    s.addEventListener("pointermove", e => {
      if(!this.ptrs.has(e.pointerId)) return;
      const prev = this.ptrs.get(e.pointerId);
      this.ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
      if(this.ptrs.size === 1 && this.dragging){
        const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
        this.moved += Math.hypot(dx, dy);
        this.cam.x -= dx; this.cam.y -= dy;
        this.clampCam();
        if(this.moved > 26) this.hideHint();
      }
    });
    const end = e => {
      if(!this.ptrs.has(e.pointerId)) return;
      const p = this.ptrs.get(e.pointerId);
      this.ptrs.delete(e.pointerId);
      if(this.ptrs.size === 0){
        if(this.dragging && this.moved < 12 && performance.now() - this.startT < 460) this.tapAt(p.x, p.y);
        this.dragging = false;
      }
    };
    s.addEventListener("pointerup", end);
    s.addEventListener("pointercancel", end);
    this.hintT = setTimeout(() => this.hideHint(), 9000);
  }
  hideHint(){
    if(this._hintGone || !this.hintEl) return;
    this._hintGone = true;
    this.hintEl.style.opacity = "0";
  }
  tapAt(px, py){
    const wx = this.cam.x + px, wy = this.cam.y + py;
    let best = null, bd = 1e9;
    for(const c of this.creatures){
      const d = Math.hypot(c.x-wx, (c.y-11)-wy) - (c.followed ? 6 : 0);
      if(d < bd){ bd = d; best = c; }
    }
    if(best && bd < 34) this.openCard(best);
  }

  /* ================= card ================= */
  blurbFor(c){
    const z = this.zoneAt(c.x, c.y);
    const lead = { canopy:"Lives high up in the leaves.", floor:"Lives out on the open ground.", shore:"Lives down at the water's edge." }[z] || "";
    const notable = [];
    for(const t of this.TRAITS){ const v = c.genome[t.k]; if(v === 0 || v === 2) notable.push(t.phrase[v]); }
    const R = this.mul(c.seed ^ 0x5f3a), picks = [];
    while(picks.length < 2 && notable.length) picks.push(notable.splice(Math.floor(R()*notable.length), 1)[0]);
    return lead + (picks.length ? " Has " + picks.join(" and ") + "." : "");
  }
  openCard(c){
    const g = c.genome;
    const shown = ["bodySize","feet","legLength","eyes","coat","tail"];
    const n = this.creatures.filter(o => o.fam === c.fam).length;
    const card = {
      eyebrow: "Field note · " + (this.ZONE_LABEL[this.zoneAt(c.x,c.y)] || ""),
      name: c.fam.name + " family",
      blurb: this.blurbFor(c),
      mine: !!c.followed,
      newLabel: (c.followed && c.newTrait) ? this.TR[c.newTrait].phrase[g[c.newTrait]] : "",
      rows: shown.map(k => ({ label: this.TR[k].label, value: this.TR[k].words[g[k]], hot: c.newTrait === k })),
      countLine: n + " of the " + c.fam.name + " family are alive right now."
    };
    this.setState({ card }, () => {
      this.drawPlate(c);
      if(this.sheetEl) this.sheetEl.style.transform = "translateY(0)";
    });
    this.hideHint();
  }
  closeCard(){ if(this.sheetEl) this.sheetEl.style.transform = "translateY(104%)"; }

  /* ================= the plate ================= */
  palette(g, R){
    const fam = [ { h:40, s:46, l:68 }, { h:15, s:58, l:55 }, { h:64, s:23, l:39 } ][g.tint];
    const h = fam.h + (R()-0.5)*18, s = fam.s + (R()-0.5)*12, l = fam.l + (R()-0.5)*7;
    const H = (a,b,c) => "hsl(" + a.toFixed(1) + "," + Math.max(6,Math.min(84,b)).toFixed(1) + "%," + Math.max(5,Math.min(96,c)).toFixed(1) + "%)";
    return {
      deep:  H(h-8, s+12, l-27),
      shade: H(h-4, s+7,  l-14),
      mid:   H(h, s, l),
      light: H(h+5, s-6,  l+12),
      hi:    H(h+9, s-16, l+24),
      belly: H(h+8, s-14, l+19),
      mark:  H(h-26+(R()-0.5)*20, s+16, l-20),
      edge:  "hsla(" + (h-8).toFixed(1) + "," + Math.min(84,s+12).toFixed(1) + "%," + Math.max(5,l-27).toFixed(1) + "%,0.075)",
      skin:  H(h+6, s+22, l-4),
      lum:   l
    };
  }
  organicPath(cx, cy, rx, ry, rot, R, wob, n){
    const pts = [];
    for(let i=0;i<n;i++){
      const a = i/n*this.TAU, k = 1 + (R()-0.5)*2*wob;
      const px = Math.cos(a)*rx*k, py = Math.sin(a)*ry*k;
      pts.push([px*Math.cos(rot) - py*Math.sin(rot) + cx, px*Math.sin(rot) + py*Math.cos(rot) + cy]);
    }
    const P = new Path2D();
    P.moveTo((pts[0][0]+pts[n-1][0])/2, (pts[0][1]+pts[n-1][1])/2);
    for(let i=0;i<n;i++){
      const p = pts[i], q = pts[(i+1)%n];
      P.quadraticCurveTo(p[0], p[1], (p[0]+q[0])/2, (p[1]+q[1])/2);
    }
    P.closePath();
    return P;
  }
  /* fill a shape the way gouache behaves: flat body, brushy light, pooled edge */
  outline(x, P, col, w){
    x.fillStyle = col;
    for(let k=0;k<8;k++){
      const a = k/8*this.TAU;
      x.save(); x.translate(Math.cos(a)*w, Math.sin(a)*w); x.fill(P); x.restore();
    }
  }
  /* short curved strokes that follow the form — the gouache look */
  brush(x, n, box, col, alpha, len, wid, ang, R){
    x.lineCap = "round"; x.strokeStyle = col;
    for(let i=0;i<n;i++){
      x.globalAlpha = alpha*(0.5 + R()*0.85);
      x.lineWidth = wid*(0.6 + R()*0.9);
      const px = box[0] + R()*box[2], py = box[1] + R()*box[3];
      const a = ang + (R()-0.5)*0.8, l = len*(0.5 + R());
      x.beginPath();
      x.moveTo(px - Math.cos(a)*l/2, py - Math.sin(a)*l/2);
      x.quadraticCurveTo(px + Math.sin(a)*(R()*10-5), py - Math.cos(a)*(R()*10-5), px + Math.cos(a)*l/2, py + Math.sin(a)*l/2);
      x.stroke();
    }
    x.globalAlpha = 1;
  }
  limb(x, pts, w0, w1, col, edge){
    x.lineCap = "round"; x.lineJoin = "round";
    x.strokeStyle = edge; x.lineWidth = w0 + 7;
    x.beginPath(); x.moveTo(pts[0][0], pts[0][1]);
    x.quadraticCurveTo(pts[1][0], pts[1][1], pts[2][0], pts[2][1]); x.stroke();
    x.strokeStyle = edge; x.lineWidth = w1 + 7;
    x.beginPath(); x.moveTo(pts[2][0], pts[2][1]);
    x.quadraticCurveTo(pts[3][0], pts[3][1], pts[4][0], pts[4][1]); x.stroke();
    x.strokeStyle = col; x.lineWidth = w0;
    x.beginPath(); x.moveTo(pts[0][0], pts[0][1]);
    x.quadraticCurveTo(pts[1][0], pts[1][1], pts[2][0], pts[2][1]); x.stroke();
    x.lineWidth = w1;
    x.beginPath(); x.moveTo(pts[2][0], pts[2][1]);
    x.quadraticCurveTo(pts[3][0], pts[3][1], pts[4][0], pts[4][1]); x.stroke();
  }
  drawPlate(c){
    const el = this.plateEl; if(!el) return;
    const CW = 680, CH = 620, dpr = Math.min(devicePixelRatio || 1, 2);
    el.width = CW*dpr; el.height = CH*dpr;
    const x = el.getContext("2d");
    x.setTransform(dpr,0,0,dpr,0,0);
    x.clearRect(0,0,CW,CH);
    const g = c.genome;
    const R = this.mul(c.seed ^ 0x2b17);
    const zone = this.zoneAt(c.x, c.y);
    const P = this.palette(g, R);

    const legL = 30 + g.legLength*42;
    const bRX  = 94*(0.80 + g.bodySize*0.20);
    const bRY  = 63*(0.86 + g.bodySize*0.14);
    const bCY  = -(legL + bRY*0.94);
    const hR   = 62*(0.92 + (2-g.bodySize)*0.06);
    const hX   = bRX*0.78 + hR*0.14;
    const hY   = bCY - bRY*0.70 - hR*0.44;
    const eR   = hR*(0.15 + g.ears*0.28);
    const topY = hY - hR - eR*1.2;
    const S    = Math.min(1.0, 420/(0 - topY));
    const cx   = CW*0.46, gy = CH*0.50 - topY*S*0.5 + 30;

    this.plateScene(x, CW, CH, zone, cx, gy, S, P, R);

    x.save(); x.translate(cx, gy); x.scale(S, S);
    /* ground shadow */
    x.globalAlpha = 0.20; x.fillStyle = "#4A4632";
    x.beginPath(); x.ellipse(8, 6, bRX*1.25, 22 + g.bodySize*5, 0, 0, this.TAU); x.fill();
    x.globalAlpha = 1;

    const footShape = (fx, front) => {
      const w = g.feet === 2 ? 40 : g.feet === 1 ? 30 : 20;
      if(g.feet === 2){
        const web = new Path2D();
        web.moveTo(fx - 12, -13);
        web.quadraticCurveTo(fx + 30, -12, fx + w, 2);

    } else if(zone === "floor"){

        const px = R()*CW, py = gy + 12 + R()*88, r2 = 3 + R()*8;
        x.globalAlpha = 0.9;
        x.fillStyle = ["#C3B792","#A79B78","#E3D9BC","#D8C6A4"][Math.floor(R()*4)];
        x.beginPath(); x.ellipse(px, py, r2, r2*0.7, R()*3, 0, this.TAU); x.fill();
        x.globalAlpha = 0.5; x.fillStyle = "#FFFAEC";
        x.beginPath(); x.ellipse(px - r2*0.2, py - r2*0.22, r2*0.4, r2*0.24, 0, 0, this.TAU); x.fill();
      }
      x.globalAlpha = 0.5; x.strokeStyle = "#CFC3A0"; x.lineWidth = 3; x.lineCap = "round";
      for(let i=0;i<10;i++){
        const wy = gy + 30 + R()*70;
        x.beginPath(); x.moveTo(R()*CW - 120, wy); x.quadraticCurveTo(CW*0.5, wy - 8, R()*CW + 120, wy + 6); x.stroke();
      }
      x.globalAlpha = 1;
    }
  }
  plateFinish(x, CW, CH){
    const v = x.createRadialGradient(CW*0.48, CH*0.46, CH*0.34, CW*0.48, CH*0.46, CH*0.84);
    v.addColorStop(0, "rgba(250,245,232,0)");
    v.addColorStop(1, "rgba(244,235,214,0.5)");
    x.fillStyle = v; x.fillRect(0,0,CW,CH);
    if(!this._grain) this._grain = this.grainPattern(x);
    x.globalAlpha = 0.09; x.globalCompositeOperation = "overlay";
    x.fillStyle = this._grain; x.fillRect(0,0,CW,CH);
    x.globalCompositeOperation = "source-over"; x.globalAlpha = 1;
    if((this.props.portraitFrame || "field plate") === "hand lens"){
      x.strokeStyle = "rgba(20,101,127,.32)"; x.lineWidth = 4;
      x.beginPath(); x.arc(CW/2, CH/2, CH*0.44, 0, this.TAU); x.stroke();
      x.strokeStyle = "rgba(255,255,255,.5)"; x.lineWidth = 10;
      x.beginPath(); x.arc(CW/2, CH/2, CH*0.455, 0, this.TAU); x.stroke();
    }
  }
}
</script>
